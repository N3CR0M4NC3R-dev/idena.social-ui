<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
        <link rel="shortcut icon" href="/favicon.ico" />
        <link
          rel="icon"
          type="image/png"
          sizes="32x32"
          href="/favicon-32x32.png"
        />
        <link
          rel="icon"
          type="image/png"
          sizes="16x16"
          href="/favicon-16x16.png"
        />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#fdfcfa" />
		<meta name="color-scheme" content="light" />
		<title>Idena Social</title>
    <script>
      try {
        var theme = localStorage.getItem('theme');
        if (theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#141210');
        }
      } catch (e) {}
    </script>
    <style>
      :root {
        color-scheme: light;
        --canvas: #fdfcfa;
        --ink: #1c1814;
        --ink-muted: #776f62;
        --line: #e7e3db;
        --btn: #e7e3db;
        --btn-hover: #d6d0c4;
      }
      html.dark {
        color-scheme: dark;
        --canvas: #141210;
        --ink: #ece8e1;
        --ink-muted: #9a9184;
        --line: #2f2b26;
        --btn: #2f2b26;
        --btn-hover: #3b3631;
      }
      @font-face {
        font-family: "Cinzel";
        font-style: normal;
        font-display: swap;
        font-weight: 400 900;
        src: url("/fonts/cinzel-latin-wght-normal.woff2") format("woff2");
      }
      body {
        margin: 0;
        padding: 0 16px;
        background-color: var(--canvas);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .card {
        box-sizing: border-box;
        max-width: 400px;
        margin: 15vh auto;
        padding: 32px;
        border: 1px solid var(--line);
        border-radius: 16px;
        text-align: center;
      }
      h3 {
        margin: 0 0 8px;
        font-size: 20px;
        font-family: "Cinzel", "Trajan Pro", Georgia, serif;
        font-weight: 700;
        line-height: 24px;
      }
      p {
        margin: 0 0 24px;
        color: var(--ink-muted);
        font-size: 15px;
        line-height: 20px;
      }
      button {
        height: 36px;
        padding: 0 16px;
        border: none;
        border-radius: 9999px;
        background-color: var(--btn);
        color: var(--ink);
        font-family: inherit;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: background-color 150ms;
      }
      button:hover {
        background-color: var(--btn-hover);
      }
    </style>
	</head>
	<body>
		<div class="card">
			<h3>Transaction Submitted</h3>
			<p>You may close this window.</p>
			<button onclick="window.open('', '_self', ''); window.close();">Close Window</button>
		</div>
	</body>
</html>
