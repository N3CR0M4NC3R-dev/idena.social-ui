<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
        <link rel="shortcut icon" href="/favicon.ico" />
        <link
          rel="icon"
          type="image/png"
          sizes="32x32"
          href="/favicon-32x32.png"
        />
        <link
          rel="icon"
          type="image/png"
          sizes="16x16"
          href="/favicon-16x16.png"
        />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#fdfcfa" />
		<meta name="color-scheme" content="light" />
    <script>
      try {
        var theme = localStorage.getItem('theme');
        if (theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#141210');
        }
      } catch (e) {}
    </script>
    <style>
      :root {
        color-scheme: light;
        --canvas: #fdfcfa;
        --ink: #1c1814;
        --ink-muted: #776f62;
        --line: #e7e3db;
        --btn: #e7e3db;
        --btn-hover: #d6d0c4;
      }
      html.dark {
        color-scheme: dark;
        --canvas: #141210;
        --ink: #ece8e1;
        --ink-muted: #9a9184;
        --line: #2f2b26;
        --btn: #2f2b26;
        --btn-hover: #3b3631;
      }
      body {
        margin: 0;
        background-color: var(--canvas);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 15px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .column {
        box-sizing: border-box;
        max-width: 600px;
        min-height: 100vh;
        margin: 0 auto;
        border-left: 1px solid var(--line);
        border-right: 1px solid var(--line);
      }
      h2 {
        position: sticky;
        top: 0;
        display: flex;
        align-items: center;
        height: 53px;
        margin: 0;
        padding: 0 16px;
        border-bottom: 1px solid var(--line);
        background-color: color-mix(in srgb, var(--canvas) 85%, transparent);
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
        font-size: 20px;
        font-weight: 800;
        line-height: 24px;
      }
      .section {
        padding: 16px;
        border-bottom: 1px solid var(--line);
      }
      p {
        margin: 0;
      }
      ul {
        margin: 12px 0 0;
        padding-left: 20px;
      }
      li + li {
        margin-top: 8px;
      }
      li::marker {
        color: var(--ink-muted);
      }
      a {
        color: #1da1f2;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      button {
        height: 36px;
        padding: 0 16px;
        border: none;
        border-radius: 9999px;
        background-color: var(--btn);
        color: var(--ink);
        font-family: inherit;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: background-color 150ms;
      }
      button:hover {
        background-color: var(--btn-hover);
      }
      @media (max-width: 600px) {
        .column {
          border-left: none;
          border-right: none;
        }
      }
    </style>
		<title>Idena Social</title>
	</head>
	<body>
		<main class="column">
      <h2>Attributions</h2>
      <div class="section">
        <p>The following creatives are used with attribution:</p>
        <ul>
          <li><a href="https://www.svgrepo.com/svg/379925/alert-error" target="_blank" rel="noopener noreferrer">Creative: Comment Alert Error SVG Vector, Licence: MIT License, Author: basicons</a></li>
        </ul>
      </div>
      <div class="section">
        <button onclick="window.open('', '_self', ''); window.close();">Close Window</button>
      </div>
		</main>
	</body>
</html>
